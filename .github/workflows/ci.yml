name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dashboard]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
